[platformio]
src_dir = .

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:servo_setid]
build_src_filter =
  -<*>
  +<servo_setid/*>

[env:main_fw]
build_src_filter =
  -<*>
  +<Final_Firmware_Main/*>
; camera frame buffers live in OPI PSRAM (RAM), not flash, so they don't need
; a bigger app partition. huge_app.csv gives one 3MB app slot and NO second
; OTA slot at all -- ArduinoOTA needs two slots to write into while the
; running one stays live, so OTA hard-crashes under that table regardless of
; firmware size. default.csv's two 1.25MB slots comfortably fit this build
; (~950KB) and are what makes OTA actually work.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv
lib_deps =
  links2004/WebSockets
  bblanchon/ArduinoJson @ ^7
